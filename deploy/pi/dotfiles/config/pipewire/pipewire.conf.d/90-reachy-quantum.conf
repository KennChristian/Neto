# Choppy-audio fix (2026-07-21).
# Bluetooth SBC output on a loaded 4-core Pi cannot survive 128-sample
# (2.7 ms) cycles. Pulse clients (the app's ALSA "type pulse" streams)
# were dragging the whole graph down to tiny quanta -> thousands of xruns.
# Raise the quantum floor so every driver runs at >= 1024/48000 (21 ms).
context.properties = {
    default.clock.quantum     = 1024
    default.clock.min-quantum = 1024
    default.clock.max-quantum = 2048
}
