# Choppy-audio fix (2026-07-21). See /etc/systemd/system/user@.service.d/
# 99-reachy-rtprio.conf. DISABLE_RTKIT forces libpipewire-module-rt onto its
# direct sched_setscheduler() path (SCHED_RR 88) instead of the flaky RTKit
# route. Requires LimitRTPRIO + LimitNICE (renice -11 must succeed or
# module-rt falls back / errors out).
[Service]
LimitRTPRIO=95
LimitRTTIME=infinity
LimitMEMLOCK=infinity
LimitNICE=-20
Environment=DISABLE_RTKIT=1
