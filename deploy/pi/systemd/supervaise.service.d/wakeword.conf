[Service]
# On-device openWakeWord backend. Model: hey_cee_jap.onnx from
# hey_cee_jap_bundle(2).zip (installed 2026-08-05) — 44k-sample retrain with
# WW-5 phrases trained in as explicit negatives.
Environment=CJ_WAKE_BACKEND=openwakeword
# Confirmed safe for THIS model 2026-08-05 (TTS-measured, echo voice):
# positives "Hey Cee-Jap" 0.840 / "Hey See Jap" 0.913; WW-5 negatives
# "chief justice" 0.007, "see jay" 0.007, "hey CJ" 0.001, "CJ Panganiban"
# 0.001. Only near-homophones exceed 0.1: "sea chap" 0.916 (is the phrase),
# "she jumped" 0.172.
Environment=CJ_WAKE_OWW_THRESHOLD=0.1
# 2.5s capture window so the full "Hey Cee-Jap" fits in one window (1.5s split it).
Environment=CJ_WAKE_WINDOW_S=2.5
# Display/log phrase only — detection is the onnx model, which knows both forms.
Environment="CJ_WAKE_PHRASE=Hey Cee-Jap"
Environment=CJ_WAKE_COOLDOWN_S=0.1
Environment=CJ_MIC_TRAILING_SILENCE_S=1
