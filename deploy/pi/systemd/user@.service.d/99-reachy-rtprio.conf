# Choppy-audio fix (2026-07-21): allow the user manager (and therefore the
# pipewire/wireplumber user services) to use SCHED_RR and negative nice.
# rtkit-daemon never reliably grants RT on this headless box (no seat/portal,
# priority clamped to 20, grants observed not to stick), so PipeWire's
# module-rt must take its direct sched_setscheduler() path. That path is only
# chosen when BOTH RLIMIT_RTPRIO suffices AND renice(-11) succeeds
# (module-rt.c: set_nice failure silently forces the RTKit fallback).
[Service]
LimitRTPRIO=95
LimitRTTIME=infinity
LimitMEMLOCK=infinity
LimitNICE=-20
