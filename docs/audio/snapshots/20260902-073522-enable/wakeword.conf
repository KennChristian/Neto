[Service]
# On-device openWakeWord backend. MODEL SWITCHED 2026-08-25 to hi_see_jap.onnx
# (hi_see_jap_bundle.zip, trained 2026-08-21 on REAL "Hi See-Jap" recordings:
# 35k samples, val recall 0.98 / 0.89 unseen speaker, ww5_negatives_fired 0).
# Previous model hey_cee_jap.onnx stays on disk (+ backup_2026-08-25/); to roll
# back delete the MODEL_PATH line and restore thresholds 0.07.
Environment=CJ_WAKE_BACKEND=openwakeword
Environment=CJ_WAKE_OWW_MODEL_PATH=/home/pollen/Supervaise-Reachy-Mini-Project-main/app/wake/models/hi_see_jap.onnx
# TTS-measured 2026-08-25 (tts-1 echo/nova/onyx, 1.5s padded), NEW vs old:
#   "Hi Cee-Jap" 0.90-0.95 (old 0.35-0.64)   "Hey Cee-Jap" 0.90-0.93 (same)
#   bare "Cee-Jap" 0.78-0.89 (old 0.04-0.90)  "Okay Cee-Jap" 0.62 echo only
#   NEGATIVES got hotter: "chief justice" 0.50-0.83, "see jay" 0.44-0.65,
#   "hey CJ" 0.19, "CJ Panganiban" 0.12, "sea chap"/"she jumped" ~0.9 (both
#   models). Everything else <= 0.01. Threshold 0.2 clears hey CJ / CJ
#   Panganiban and keeps every natural wake form; "chief justice" spoken AT
#   the sleeping robot can still wake it — raise toward 0.4 if that bites,
#   lower toward 0.1 if real voices miss. Trainer's recommendation was 0.05.
# 2026-09-02 (user: "make microphone more sensitive especially the wake word"):
# journal evidence — real wakes fire at 0.010-0.056 (hugging the old 0.01
# floor), background peaks ~0.001. 0.005 keeps ~5x margin over noise and
# catches the quieter/farther attempts. Digital pre-gain was tested (1x-6x on
# real room audio through hi_see_jap.onnx) and does NOT move scores —
# openWakeWord's feature frontend is level-normalized, so gain is not a lever.
# Backup ~/wakeword.conf.bak-sensitive-20260902.
# 2026-09-02 event prep (2h before event, Sony BT): 0.005 fired on noise in a
# QUIET room (0.007 fire, no DoA angle, empty transcript — journal 04:40); an
# event hall is louder. Real wakes score 0.010-0.056 -> 0.01 keeps them.
Environment=CJ_WAKE_OWW_THRESHOLD=0.01
# 2.5s capture window so the full "Hey Cee-Jap" fits in one window (1.5s split it).
Environment=CJ_WAKE_WINDOW_S=2.5
# Display/log phrase only — detection is the onnx model, which knows both forms.
Environment="CJ_WAKE_PHRASE=Hi Cee-Jap / Cee-Jap"
Environment=CJ_WAKE_COOLDOWN_S=0.1
# 2026-08-31 (user: "make answering faster, avoid fillers where possible"):
# trailing silence 1.5->1.2 (0.3 s off every turn), context prefill 5000->3500
# (TTFT), filler first hold 1.2->2.2 s (fast turns now play NO filler; ack "Ah."
# still lands instantly). Backup ~/wakeword.conf.bak-latency-20260831.
# 2026-08-31 12:50: a stale /maintain tab re-applied listen 1.5 + pace 12.5 at 08:35 (wake 0.08->0.1 was the intended edit); restored 1.2 / 14.0, dashboard form fixed to post changed fields only.
Environment=CJ_MIC_TRAILING_SILENCE_S=1.2
# STOP WORD (added 2026-08-09): the same phrase spoken WHILE the answer plays
# cuts playback and goes straight back to listening (no fresh wake needed).
# Separate, higher threshold than the 0.07 wake threshold — a false stop
# (0.4 until 2026-08-21 — unreachable for many real prosodies given wake
# needs 0.07; peak mid-answer scores now logged as "[stop] answer played
# out — peak ..." for evidence-based tuning.)
# mid-answer is worse than a missed wake, and the mic hears the robot's own
# speaker during playback (XMOS AEC covers the INTERNAL speaker only; on a
# Bluetooth speaker there is no echo cancellation — raise this or disable if
# the robot stops itself). Disable with CJ_STOP_WORD_ENABLED=0.
Environment=CJ_STOP_WORD_ENABLED=1
# 2026-08-25: 0.07 -> 0.2 with the hi_see_jap model (same rationale as wake).
# 2026-08-26 (user: "make stop word more sensitive"): 0.02 -> 0.01. Journal
# evidence over 15 answers on the Sony Bluetooth speaker: non-stop peaks were
# 0.001-0.003 (the mic hears the speaker bleed with NO echo cancellation on
# Bluetooth), the one real stop scored 0.092. 0.01 is still ~3x above the
# noisiest observed non-stop peak. Backup ~/wakeword.conf.bak-stop001-20260826.
# 2026-09-02 event prep: 0.01 -> 0.02 for the Sony BT speaker (no echo
# cancellation on BT; ref feed off uncalibrated) — the robot cut its own
# answer this morning. Restore 0.01 on the internal speaker.
Environment=CJ_STOP_OWW_THRESHOLD=0.02
# P0 POST-PROCESSING (enabled 2026-08-11): dictionary NER + ASR-mishear
# correction on transcripts and spoken text (app/postprocess.py). Entity dict:
# data/entities/entity_dict.json + hand-editable entity_overrides.json
# (hot-reloaded on save — no restart needed for dictionary edits).
Environment=CJ_POSTPROC_ENABLED=1
# Audit log on tmpfs to spare the SD card (lost on reboot by design).
Environment=CJ_POSTPROC_LOG_PATH=/dev/shm/cj_postproc_corrections.jsonl
# P1 DYNAMIC TOKEN BUDGET (enabled 2026-08-11): routed theme picks the composer
# max_tokens (one-hot kiosk variant; dict CJ_TOKEN_BUDGET_BY_DIM, defaults
# A260/B240/C200/D220/E240/META120 in app/cj_chat.py).
Environment=CJ_DYNAMIC_TOKENS_ENABLED=1
# STREAMING SPEECH (enabled 2026-08-12): the answer is spoken sentence-by-
# sentence as it composes (app/stream_speak.py) — first audio ~9s after the
# question vs ~15-20s for the classic whole-answer path. Wake threshold
# lowered 0.1 -> 0.07 the same day (TTS-measured: bare "Cee-Jap" 0.86-0.90,
# negatives <= 0.014 padded) so bare/prefixed wake forms fire earlier.
Environment=CJ_STREAM_SPEECH=1
# FILIPINO ACCENT (enabled 2026-08-12): gpt-4o-mini-tts with accent-steering
# instructions replaces tts-1. Same "echo" timbre. Switch voice with
# OPENAI_TTS_VOICE (onyx = deeper); revert to the old voice by removing
# these two lines. Audition clips: /dev/shm/accent_*.mp3
Environment=OPENAI_TTS_MODEL=gpt-4o-mini-tts
Environment="OPENAI_TTS_INSTRUCTIONS=You are an elderly Filipino statesman in his late eighties, a retired Chief Justice of the Philippines. Speak English with a natural Filipino (Tagalog-influenced) accent. Warm, dignified, measured and deliberate pace, formal courtroom diction. Pronounce Filipino words, names, and places with native Tagalog pronunciation. Hyphenated syllables like dah-PEE-tahn are phonetic spellings: read them smoothly as one word, stressing the capitalized syllable. Keep vowels short and crisp, never drawn out."

# P3 DYNAMIC FILLER (enabled 2026-08-13): while the first canned filler clip
# plays, a question-relevant thinking-aloud sentence is generated (Haiku) and
# voiced (same TTS voice), then injected as the NEXT filler clip. Generation
# is ~3-4s warm — always inside the first-clip+gap window, so it never delays
# anything. Set to 0 to fall back to canned-only fillers.
Environment=CJ_DYNAMIC_FILLER=1

# Conversational mode (2026-08-21): tuned-down answers + follow-up window for
# real back-and-forth. Scale multiplies every per-topic budget (0.4 => ~30s
# answers; 1.0 restores full-length; below 1.0 the composer also gets a
# length note so answers END CLEANLY instead of truncating). After a completed
# answer the mic stays open CJ_FOLLOWUP_WINDOW_S seconds for the next question
# with no fresh wake; 0 disables.
Environment=CJ_TOKEN_BUDGET_SCALE=0.6
Environment=CJ_FOLLOWUP_WINDOW_S=0

# Latency tuning (2026-08-21): fast time-to-first-audio. Router JSON capped
# (never below ~140 — truncated JSON falls back to anchor routing); composer
# context prefill trimmed 12000->5000 (every context token delays the first
# spoken sentence); budget floor 80 stops short answers (META) hitting the
# hard cap mid-sentence.
Environment=CJ_ROUTER_MAX_TOKENS=160
Environment=CJ_CONTEXT_TOKEN_BUDGET=3500
Environment=CJ_TOKEN_BUDGET_MIN=80

# Canned fast path (2026-08-21): curated answers for common questions —
# zero tokens, near-instant playback from the clip cache. Answer file
# data/entities/canned_answers.json hot-reloads; disable with 0. After
# editing answers run scripts/prerender_canned.py to pre-warm the cache.
Environment=CJ_CANNED_ENABLED=1
# Fast open (2026-08-21 experiment, arm C): a short first sentence lets TTS
# start ~1s sooner on the streaming path (measured 4.3-4.6s vs 5.4-5.7s).
Environment=CJ_FAST_OPEN=1

# Filler A/B (2026-08-21, user test): thinking clips OFF so the turn is pure
# question -> answer. Restore by deleting these two lines (or =1) + restart.
Environment=CJ_FILLERS_ENABLED=1
Environment=CJ_DYNAMIC_FILLER=1

# Async fidelity audit (2026-08-21): Haiku checker runs during answer playback
# on the streaming path (no latency); flags logged + shown on /maintain.
Environment=CJ_FIDELITY_AUDIT=1

# Dynamic-filler priority (2026-08-21): the first filler slot holds up to
# this many seconds for the question-relevant clip before falling back to
# a canned one. 0 = old behavior (canned first, instantly).
Environment=CJ_FILLER_FIRST_WAIT_S=2.2
# 2026-08-31: first composer token in during the hold -> extend the hold by this
# much (answer audio follows the token by ~0.5-1.3 s) instead of starting a 2.6 s+
# clip the answer must wait behind; total hold capped by CJ_FILLER_HOLD_MAX_S (3.6).
# 0 = old behaviour.
Environment=CJ_FILLER_TOKEN_GRACE_S=1.6

# Latency v3 (2026-08-21): faster STT model (benchmarked 1.2-1.6s vs whisper-1
# 2.75s warm / 8.6s cold, identical transcript) + instant sub-second "Ah."
# acknowledgment at mic close (CJ_ACK_ENABLED=0 disables; clips ~/fillers_ack).
Environment=OPENAI_STT_MODEL=gpt-4o-mini-transcribe
Environment=CJ_ACK_ENABLED=1
Environment=CJ_VOICE_LOCK=1
Environment=CJ_VOICE_LOCK_IDLE_S=10
Environment=CJ_VOICE_LOCK_THRESHOLD=0.32

# Mic sensitivity + listen-now (2026-08-25, user: "sometimes it is not
# listening" / "a bit late in listening"): the recorder's speech threshold is
# max(noise_rms * MULT, FLOOR) capped at CAP (code defaults 3.5 / 350 / 2000).
# Lower = more sensitive; too low and room noise never lets a question end.
# 2026-09-02: floor 250->200, mult 3.0->2.5 (user: "make mic more sensitive";
# idle noise floor is ~60 rms so the FLOOR is what actually binds) — the
# recorder now counts quieter speech as "still talking"; raise back if room
# noise keeps the mic from closing.
Environment=CJ_MIC_RMS_FLOOR=200
Environment=CJ_MIC_RMS_MULT=2.5
Environment=CJ_MIC_RMS_CAP=1500
# Stop-word diagnostics: keep the mic audio the stop listener scored during
# the last answer at /dev/shm/cj_stop_last.wav (+ top scores in the journal).
Environment=CJ_STOP_DEBUG_WAV=1

# 2026-08-26 hearing + delivery knobs (defaults live in cj_voice_cloud.py;
# lines here are documentation — uncomment to override):
#   CJ_MIC_MIN_SPEECH_MS=240  sustained speech needed before the recorder
#                             counts "speech started" (kills one-frame false
#                             starts: knocks, perk motor, speaker tail). 0 = old.
#   CJ_BT_SETTLE_S=0.4        wait after an answer before probing the noise
#                             floor when playback is on a Bluetooth speaker
#                             (BT lags aplay 200-400 ms; no AEC on BT).
#   CJ_SENTENCE_PLAYER=stream streamed answers play through ONE persistent
#                             output stream (gapless sentence joins); =aplay
#                             restores the per-sentence aplay path.
#   CJ_SENT_GAP_MS=150        pause kept between sentences after trimming the
#                             clips' baked-in edge silence (~50 ms lead,
#                             200-300 ms trail measured).
#   CJ_SENT_OUT_LATENCY_S=0.15 output buffer for the stream player.
#   Stop meter: barge-in scores now publish to /dev/shm/cj_stop_live.json
#   (/api/stop, /maintain "Stop meter" card) instead of the wake meter.
# 2026-08-30 evening (user: "a bit fast, just a little"): base 0.88->0.91, band 0.85-0.92 -> 0.88-0.95, ceiling 12->12.5 chars/s. Backup ~/wakeword.conf.bak-speed088-20260830.
# 2026-08-31 (user: "voice was shaky"): the 0.91 speed-up pushed raw rates to 13.6-17
# chars/s; ceiling 12.5 forced 8-11.5% WSOLA stretches (>10% colours the timbre =
# the shakiness). Ceiling -> 14.0 (let it BE a bit fast), max stretch 0.12 -> 0.08.
# Backup ~/wakeword.conf.bak-shaky-20260831.
Environment=CJ_TEMPO_RATE_MAX=16.5
Environment=CJ_MAX_WORDS=60
Environment=CJ_SPEED_BASE=0.95
# 2026-08-31 13:15 stability pick (user, A/B at pace 0.91 via ~/tools/pronunciation/stab_ab.py):
# neutral resting voice 0.50 -> 0.65 (style 0). smooth_delivery starts each answer here;
# emotional sentences slew from it. Canned/filler clips stay at 0.50 (cached). Backup ~/wakeword.conf.bak-stab065-20260831.
Environment=CJ_VOICE_NEUTRAL=0.65:0
Environment=CJ_SPEED_MIN=0.92
Environment=CJ_SPEED_MAX=0.99
Environment=CJ_TEMPO_MAX=0.04
# VAD gate (armed 2026-08-30 evening, user): captures with < this many seconds of
# Silero-detected speech are discarded after STT (VAD runs parallel to STT, no
# latency). Log-only day: real questions 1.6-3.1 s, noise captures 0.0 s.
# 0 = log-only again.
Environment=CJ_VAD_MIN_SPEECH_S=0.4
# Phase 2 (2026-08-31): while a voice lock holds, the XVF3800 switches from its
# 4 adaptive beams to ONE fixed beam at the lock-time speech angle (hardware
# attenuation of off-axis voices; stacks with the VAD gate). Auto beams are
# restored on lock release and at boot. 0 disables.
Environment=CJ_BEAM_FIXED=1
# Listen direction (2026-09-02, user: "make it listen on the back part of the
# robot"): while no voice lock is steering the beam, the two fixed beams are
# parked on this side of the body (chip frame 0=left 90=front 180=right
# 270=back; back = 225/315). auto = chip's 4 adaptive beams (old behaviour);
# also front / left / right / <deg>[,<deg>].
Environment=CJ_LISTEN_DIRECTION=back

# AEC reference feed for Bluetooth speakers (2026-09-01, OFF until calibrated):
# on a bluealsa route the app also writes a delayed copy of everything it plays
# to the XMOS (pcm cj_ref_feed) at -55 dB with REF_GAIN 1000, so the XVF3800
# can cancel its own voice. Run ~/tools/aec_ref_calib.py with the speaker on to
# get the delay (echo must land 0-190 ms after the reference), then set:
# 2026-09-02 event prep: feed OFF — delay 0 ms was never calibrated (run
# ~/tools/aec_ref_calib.py with the Sony on, then set delay and re-enable).
Environment=CJ_AEC_REF_FEED=0
Environment=CJ_AEC_REF_DELAY_MS=0
Environment=CJ_AEC_REF_GAIN=1000

# 2026-09-01 per-mode answer length: event mode (scripted Q&A) caps at 40 words
# (≈15 s); free conversation keeps CJ_MAX_WORDS above. Empty = same as CJ_MAX_WORDS.
Environment=CJ_MAX_WORDS_EVENT=40
